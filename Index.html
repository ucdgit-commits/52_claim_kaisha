<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>協力会社過去トラブル検索ツール</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { font-size: 110%; } /* 全体フォントサイズ110% */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #64748b; }
        .tab-inactive:hover { color: #334155; border-bottom: 2px solid #cbd5e1; }
    </style>
</head>
<body class="text-gray-800 text-sm h-screen flex flex-col relative">

    <!-- フルスクリーン ローディングオーバーレイ -->
    <div id="loadingOverlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white/80 backdrop-blur-sm transition-opacity duration-300">
        <div class="bg-white p-6 rounded-xl shadow-lg border border-gray-100 flex flex-col items-center max-w-sm w-full mx-4 space-y-4">
            <svg class="animate-spin h-10 w-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            
            <div class="text-center w-full">
                <p id="loadingText" class="text-gray-800 font-bold text-base">スプレッドシートへ接続中...</p>
                <p class="text-gray-400 text-xs mt-1">（準備完了後は高速で動作します）</p>
            </div>

            <!-- プログレスバー -->
            <div class="w-full space-y-1.5">
                <div class="w-full bg-gray-200 rounded-full h-2.5 overflow-hidden">
                    <div id="loadingBar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-150 ease-out" style="width: 0%"></div>
                </div>
                <div class="flex justify-end">
                    <span id="loadingPercent" class="text-xs text-gray-500 font-mono font-medium">0%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 py-3 px-5 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            <h1 class="text-lg font-bold text-gray-900">協力会社過去トラブル検索ツール</h1>
        </div>
        <div class="flex items-center gap-3">
            <div id="dataStatus" class="text-xs text-gray-500 flex items-center gap-1.5"></div>
            <span class="text-xs text-gray-500 font-medium">※ベータ版：個別詳細はリンク先の報告データ要確認（64～69期7月までのDWHテストデータにて）</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-hidden flex flex-col p-4 max-w-4xl mx-auto w-full">
        
        <!-- Tabs -->
        <div class="flex space-x-6 border-b border-gray-200 mb-4 shrink-0">
            <button id="btnSearchTab" class="pb-2 px-1 text-sm tab-active focus:outline-none transition-colors" onclick="switchTab('searchTab')">トラブル検索</button>
            <button id="btnCompanyListTab" class="pb-2 px-1 text-sm tab-inactive focus:outline-none transition-colors" onclick="switchTab('companyListTab')">会社一覧</button>
        </div>

        <!-- Tab Content: Search -->
        <div id="searchTab" class="flex-1 flex flex-col overflow-hidden">
            <!-- Search Panel -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-4 shrink-0 space-y-3">
                <div class="flex flex-wrap items-center gap-3">
                    <div class="flex items-center gap-1.5 shrink-0 w-[290px]">
                        <label class="text-xs font-medium text-gray-700 whitespace-nowrap">発生期:</label>
                        <select id="filterTermFrom" class="w-28 pl-2 pr-6 py-1.5 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" onchange="applyFilters()">
                            <option value="">全期間</option><option value="64">64期</option><option value="65">65期</option><option value="66">66期</option><option value="67">67期</option><option value="68">68期</option><option value="69">69期</option>
                        </select>
                        <span class="text-xs text-gray-400">〜</span>
                        <select id="filterTermTo" class="w-28 pl-2 pr-6 py-1.5 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" onchange="applyFilters()">
                            <option value="">全期間</option><option value="64">64期</option><option value="65">65期</option><option value="66">66期</option><option value="67">67期</option><option value="68">68期</option><option value="69">69期</option>
                        </select>
                    </div>
                    <div class="flex-1 min-w-[200px] relative">
                        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="text" id="searchInput" class="w-full pl-8 pr-3 py-1.5 text-xs border border-gray-300 rounded bg-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="例：丹青TDC、 3100013" onkeydown="if(event.key === 'Enter') applyFilters()">
                    </div>
                    <button onclick="applyFilters()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-xs font-medium shadow-sm transition-colors shrink-0">検索</button>
                    <button onclick="resetFilters()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded text-xs font-medium transition-colors shrink-0">リセット</button>
                </div>

                <details class="group border-t border-gray-100 pt-2">
                    <summary class="flex items-center gap-1.5 text-xs text-gray-600 cursor-pointer select-none font-medium hover:text-blue-600 w-max">
                        <svg class="w-3.5 h-3.5 transition-transform group-open:rotate-180 text-gray-400 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        <span>さらに詳しく絞り込む</span>
                    </summary>
                    <div class="space-y-3 pt-3">
                        <!-- 横並びレイアウト -->
                        <div class="flex flex-wrap items-end gap-4">
                            <div class="w-[290px] shrink-0">
                                <label class="block text-xs font-medium text-gray-700 mb-1">請負階層:</label>
                                <select id="filterTierPreset" class="w-full pl-2 pr-6 py-1.5 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" onchange="applyFilters()">
                                    <option value="">すべての階層</option>
                                    <option value="元請_exact">元請案件のみ</option>
                                    <option value="1次請_exact">1次請案件のみ</option>
                                    <option value="1次請_below">1次請以下（深層・多重下請け）</option>
                                    <option value="2次請_below">2次請以下（より深い下請け）</option>
                                    <option value="3次請_below">3次請以下</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-3 pb-1 flex-1 min-w-[320px] flex-wrap">
                                <label class="flex items-center cursor-pointer" title="検索キーワードが事故発生当事者（トラブル発生会社）にマッチする案件のみを表示します。">
                                    <input type="checkbox" id="filterPartyOnly" class="h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded shrink-0" onchange="applyFilters()">
                                    <span class="ml-1.5 text-xs text-gray-700 whitespace-nowrap">検索した会社が「トラブル当事者」の案件のみ</span>
                                </label>
                                <span class="text-gray-300 text-xs select-none">│</span>
                                <label class="flex items-center cursor-pointer" title="トラブル発生会社（当事者）が「丹青社」となっている自社トラブルを除外します。元請が丹青社で協力会社が事故当事者の案件は保持されます。">
                                    <input type="checkbox" id="filterExcludeTanseiSole" class="h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded shrink-0" onchange="applyFilters()" checked>
                                    <span class="ml-1.5 text-xs text-gray-700 whitespace-nowrap">自社（丹青社）トラブル・単独案件を除外</span>
                                </label>
                            </div>
                        </div>

                        <!-- 自動除外データ（右寄せ指定） -->
                        <div class="border-t border-gray-100 pt-2.5 mt-1 flex justify-end">
                            <div class="flex flex-wrap items-center gap-2 text-xs text-gray-500 justify-end">
                                <span class="font-medium whitespace-nowrap text-gray-400 shrink-0">※自動除外データ:</span>
                                <div id="summaryContainer" class="text-gray-500">読み込み中...</div>
                            </div>
                        </div>
                    </div>
                </details>
            </div>

            <!-- 検索結果ヘッダー ＆ ページネーション -->
            <div class="flex flex-wrap justify-between items-center mb-2 px-1 gap-2 shrink-0">
                <div class="flex items-center gap-2">
                    <h2 class="text-xs font-semibold text-gray-700">検索結果: <span id="resultCount" class="text-blue-600 font-bold text-sm">0</span> 件</h2>
                    <span id="pageRangeText" class="text-xs text-gray-500 font-medium"></span>
                </div>
                <div class="flex items-center gap-3">
                    <div id="paginationControls" class="flex items-center gap-1.5 text-xs">
                        <button id="btnPrevPage" onclick="prevPage()" class="px-2.5 py-1 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium shadow-sm transition-colors">前へ</button>
                        <span id="pageIndicator" class="text-xs text-gray-600 font-mono font-medium px-1">1 / 1</span>
                        <button id="btnNextPage" onclick="nextPage()" class="px-2.5 py-1 bg-white border border-gray-300 rounded text-gray-700 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium shadow-sm transition-colors">次へ</button>
                    </div>
                    <span class="text-xs text-gray-400">※ 協力会社データのみ表示</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="resultsContainer">
                <div class="p-8 text-center text-gray-400 bg-white rounded border border-gray-200 text-xs">データ読み込み後、検索結果が表示されます</div>
            </div>
        </div>

        <!-- Tab Content: Company List -->
        <div id="companyListTab" class="hidden flex-1 flex flex-col overflow-hidden">
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-4 shrink-0 space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="flex flex-wrap items-center gap-3 flex-1 min-w-0">
                        <div class="flex items-center gap-1.5 shrink-0 w-[290px]">
                            <label class="text-xs font-medium text-gray-700 whitespace-nowrap">発生期:</label>
                            <select id="companyListTermFrom" class="w-28 pl-2 pr-6 py-1.5 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" onchange="renderCompanyList()">
                                <option value="">全期間</option><option value="64">64期</option><option value="65">65期</option><option value="66">66期</option><option value="67">67期</option><option value="68">68期</option><option value="69">69期</option>
                            </select>
                            <span class="text-xs text-gray-400">〜</span>
                            <select id="companyListTermTo" class="w-28 pl-2 pr-6 py-1.5 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" onchange="renderCompanyList()">
                                <option value="">全期間</option><option value="64">64期</option><option value="65">65期</option><option value="66">66期</option><option value="67">67期</option><option value="68">68期</option><option value="69">69期</option>
                            </select>
                        </div>
                        <div class="flex-1 min-w-[200px] max-w-sm relative">
                            <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                                <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <input type="text" id="companyListSearchInput" oninput="renderCompanyList()" class="w-full pl-8 pr-3 py-1.5 text-xs border border-gray-300 rounded bg-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="例：丹青TDC、 3100013">
                        </div>
                        <button onclick="resetCompanyListSearch()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded text-xs font-medium transition-colors shrink-0">クリア</button>
                    </div>
                    <!-- 丹青社除外チェックボックス（会社一覧用） -->
                    <div class="shrink-0 flex items-center h-full">
                        <label class="flex items-center cursor-pointer border-l border-gray-200 pl-4 py-1" title="会社一覧から「丹青社」を除外し、純粋な協力会社のランキングのみを表示します。">
                            <input type="checkbox" id="companyListExcludeTansei" class="h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded shrink-0" onchange="renderCompanyList()" checked>
                            <span class="ml-1.5 text-xs font-medium text-gray-700 whitespace-nowrap">自社（丹青社）を除外</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center mb-2 px-1 shrink-0">
                <h2 class="text-xs font-semibold text-gray-700" id="companyListSummaryText">集計会社数: <span class="text-blue-600 font-bold text-sm">0</span> 社</h2>
                <div class="text-xs text-gray-400">※列ヘッダー（▲▼）で並び替え可能 / 行クリックで検索へ移動</div>
            </div>

            <div class="flex-1 overflow-y-auto bg-white rounded-lg shadow-sm border border-gray-200">
                <div id="companyListContainer" class="w-full relative h-full">
                    <div class="p-8 text-center text-gray-400 text-xs">データを読み込んでください</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // グローバル状態管理
        // ==========================================
        let globalData = [];
        let validSearchData = [];
        let unmappedData = [];
        let currentFilteredResults = [];
        
        let currentPage = 1;
        const PAGE_SIZE = 500;

        let companyListSortField = 'totalCount'; // デフォルト：総関与件数順
        let companyListSortOrder = 'desc';       // デフォルト：降順
        let progressInterval = null;
        let currentProgress = 0;

        const TIER_MAP = { '元請': 0, '1次請': 1, '2次請': 2, '3次請': 3, '4次請': 4, '5次請': 5 };

        // ==========================================
        // 共通ヘルパー関数
        // ==========================================

        const normalizeStr = (str) => {
            if (!str) return '';
            return str.toString()
                .normalize('NFKC')
                .toLowerCase()
                .trim();
        };

        const formatCode7 = (code) => {
            if (!code) return '';
            const str = code.toString().trim();
            if (str === '未登録' || str === 'UNMAPPED' || str === '-') return str;
            return /^\d+$/.test(str) ? str.padStart(7, '0') : str;
        };

        const cleanCompanyName = (nameStr) => {
            if (!nameStr) return '（名称未設定）';
            return nameStr.toString().replace(/^【.*?】\s*/, '').trim() || '（名称未設定）';
        };

        const isWithinTerm = (termStr, termFrom, termTo) => {
            if (!termFrom && !termTo) return true;
            const match = (termStr || '').toString().match(/\d+/);
            if (!match) return false;
            const num = parseInt(match[0], 10);
            if (termFrom && num < parseInt(termFrom, 10)) return false;
            if (termTo && num > parseInt(termTo, 10)) return false;
            return true;
        };

        const matchesTierFilter = (rawRowTier, targetTier, condition) => {
            if (!targetTier) return true;

            const normalizedRowTier = (rawRowTier || '').toString().trim()
                .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));

            const rowIndex = TIER_MAP[normalizedRowTier];
            const targetIndex = TIER_MAP[targetTier];

            if (rowIndex === undefined || targetIndex === undefined) return false;

            if (condition === 'exact') return rowIndex === targetIndex;
            if (condition === 'below') return rowIndex >= targetIndex;
            if (condition === 'above') return rowIndex <= targetIndex;

            return false;
        };

        const getClaimNum = (row) => {
            const raw = (row['クレーム№'] || row['クレームNo'] || row['クレームNO'] || '').toString();
            const num = parseInt(raw.replace(/[^0-9]/g, ''), 10);
            return isNaN(num) ? 0 : num;
        };

        const buildRepairBadge = (repairType, row) => {
            if (!repairType) return '';
            
            let isHighAmount = false;
            if (repairType.includes('100万以上') || repairType.includes('100万円以上')) {
                isHighAmount = true;
            } else {
                const costRaw = (row['無償補修金額'] || row['是正費用'] || row['損益金額'] || row['金額'] || '').toString();
                const costVal = parseFloat(costRaw.replace(/[^0-9.]/g, ''));
                if (!isNaN(costVal) && costVal >= 1000000) {
                    isHighAmount = true;
                }
            }

            if (isHighAmount) {
                return `<span class="inline-flex items-center text-xs text-gray-800 font-semibold bg-white px-1.5 py-0.5 rounded border border-gray-200 shrink-0 whitespace-nowrap">${repairType}</span>`;
            } else {
                return `<span class="inline-flex items-center text-xs text-gray-400 bg-white px-1.5 py-0.5 rounded border border-gray-200 shrink-0 whitespace-nowrap">${repairType}</span>`;
            }
        };

        const buildFlowString = (row, displayCompanyName) => {
            const rawTargetTier = (row['当事者請負階層'] || '').toString().trim();
            const targetTier = rawTargetTier.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
            const targetIndex = TIER_MAP[targetTier] !== undefined ? TIER_MAP[targetTier] : -1;
            
            let htmlArray = [];
            let plainArray = [];
            
            if (targetIndex >= 0) {
                const tierCols = ['元請_会社名', '1次請_会社名', '2次請_会社名', '3次請_会社名', '4次請_会社名', '5次請_会社名'];
                const tierLabels = ['元請', '1次請', '2次請', '3次請', '4次請', '5次請'];
                let allUnregisteredSoFar = true;

                for (let i = 0; i <= targetIndex; i++) {
                    let isTarget = (i === targetIndex);
                    let compName = (row[tierCols[i]] || '').toString().trim();
                    if (!compName) compName = '未登録';

                    if (isTarget) {
                        htmlArray.push(`<span class="font-bold text-gray-900">[${tierLabels[i]}(当事者)] ${displayCompanyName}</span>`);
                        plainArray.push(`[${tierLabels[i]}(当事者)] ${displayCompanyName}`);
                        break;
                    } else {
                        if (compName !== '未登録') {
                            allUnregisteredSoFar = false;
                            htmlArray.push(`[${tierLabels[i]}] ${compName}`);
                            plainArray.push(`[${tierLabels[i]}] ${compName}`);
                        } else {
                            if (i === 0) {
                                htmlArray.push(`[元請] 未登録`);
                                plainArray.push(`[元請] 未登録`);
                            } else if (!allUnregisteredSoFar) {
                                htmlArray.push(`[${tierLabels[i]}] 未登録`);
                                plainArray.push(`[${tierLabels[i]}] 未登録`);
                            }
                        }
                    }
                }
            } else {
                const motoName = (row['元請_会社名'] || '').toString().trim() || '未登録';
                const priName = (row['1次請_会社名'] || '').toString().trim() || '未登録';
                
                if (motoName === displayCompanyName || rawTargetTier === '元請') {
                    htmlArray.push(`<span class="font-bold text-gray-900">[元請(当事者)] ${displayCompanyName}</span>`);
                    plainArray.push(`[元請(当事者)] ${displayCompanyName}`);
                } else {
                    htmlArray.push(`[元請] ${motoName}`);
                    plainArray.push(`[元請] ${motoName}`);
                    if (priName === displayCompanyName || rawTargetTier.includes('1次請') || rawTargetTier.includes('１次請')) {
                        htmlArray.push(`<span class="font-bold text-gray-900">[1次請(当事者)] ${displayCompanyName}</span>`);
                        plainArray.push(`[1次請(当事者)] ${displayCompanyName}`);
                    } else {
                        if (priName !== '未登録' || motoName !== '未登録') {
                            htmlArray.push(`[1次請] ${priName}`);
                            plainArray.push(`[1次請] ${priName}`);
                        }
                        htmlArray.push(`<span class="font-bold text-gray-900">[当事者(${rawTargetTier || '不明'})] ${displayCompanyName}</span>`);
                        plainArray.push(`[当事者(${rawTargetTier || '不明'})] ${displayCompanyName}`);
                    }
                }
            }
            return {
                html: htmlArray.join(' ＞ '),
                plain: plainArray.join(' ＞ ')
            };
        };

        // ==========================================
        // プログレスバーアニメーション
        // ==========================================
        function startProgressAnimation() {
            currentProgress = 0;
            const bar = document.getElementById('loadingBar');
            const percentText = document.getElementById('loadingPercent');
            const textLabel = document.getElementById('loadingText');
            
            if (progressInterval) clearInterval(progressInterval);
            
            progressInterval = setInterval(() => {
                if (currentProgress < 75) {
                    currentProgress += Math.floor(Math.random() * 3) + 2;
                } else if (currentProgress < 94) {
                    currentProgress += 1;
                }
                if (currentProgress > 94) currentProgress = 94;
                
                if (bar) bar.style.width = currentProgress + '%';
                if (percentText) percentText.textContent = currentProgress + '%';
                
                if (textLabel) {
                    if (currentProgress < 30) {
                        textLabel.textContent = 'スプレッドシートへ接続中...';
                    } else if (currentProgress < 70) {
                        textLabel.textContent = '高速検索用のデータをロード中...';
                    } else {
                        textLabel.textContent = '検索インデックスを構築中...';
                    }
                }
            }, 120);
        }

        function finishProgressAnimation(onComplete) {
            if (progressInterval) clearInterval(progressInterval);
            
            const bar = document.getElementById('loadingBar');
            const percentText = document.getElementById('loadingPercent');
            const textLabel = document.getElementById('loadingText');
            
            if (bar) bar.style.width = '100%';
            if (percentText) percentText.textContent = '100%';
            if (textLabel) textLabel.textContent = '準備完了！';
            
            setTimeout(() => {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay) overlay.classList.add('hidden');
                if (onComplete) onComplete();
            }, 300);
        }

        // ==========================================
        // 初期化・データ取得
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            loadDataFromSpreadsheet();
        });

        function loadDataFromSpreadsheet() {
            startProgressAnimation();

            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(processData)
                    .withFailureHandler((err) => {
                        if (progressInterval) clearInterval(progressInterval);
                        console.error("Data Load Error:", err);
                        document.getElementById('loadingOverlay').classList.add('hidden');
                        document.getElementById('dataStatus').innerHTML = `<span class="text-red-500 font-bold">⚠️ 読込エラー: ${err.message || 'データ取得失敗'}</span>`;
                        document.getElementById('resultsContainer').innerHTML = `<div class="p-8 text-center text-red-500 bg-red-50 rounded border border-red-200 text-xs font-bold">データの読み込みに失敗しました。<br>デプロイのバージョンが最新か確認してください。<br>エラー詳細: ${err.message || '不明なエラー'}</div>`;
                    })
                    .getSpreadsheetData();
            } else {
                console.warn("GAS環境ではないため、テスト用データを生成します。");
                setTimeout(() => {
                    const dummyData = [
                        {
                            'トラブル発生会社_UNMAPPED詳細区分': '【正規登録会社】',
                            'トラブル発生会社_コード7桁': '3100013',
                            'トラブル発生会社_正式名称': '丹青TDC',
                            'トラブル発生会社_表示名称': '丹青TDC',
                            '1次請_会社名': '丹青TDC',
                            '発生期': '68期',
                            '当事者請負階層': '1次請',
                            '受託業務範囲名': '施工',
                            '当社立ち位置区分': '当社元請案件',
                            'クレーム№': '68001',
                            '報告種別名': '施工不良',
                            '無償補修区分名': '100万円以上',
                            '物件名': 'サンプルオフィスビル施工',
                            '事象概要': '壁面クロス剥がれおよび塗装不備による手直し発生。'
                        }
                    ];
                    processData(dummyData);
                }, 500);
            }
        }

        function processData(data) {
            finishProgressAnimation(() => {
                globalData = data || [];
                
                validSearchData = globalData.filter(row => {
                    const unmapped = row['トラブル発生会社_UNMAPPED詳細区分'];
                    return unmapped === '【正規登録会社】' || unmapped === '【コード未登録会社】';
                });
                
                unmappedData = globalData.filter(row => {
                    const unmapped = row['トラブル発生会社_UNMAPPED詳細区分'];
                    return unmapped !== '【正規登録会社】' && unmapped !== '【コード未登録会社】';
                });

                document.getElementById('dataStatus').innerHTML = `<span>対象件数: ${globalData.length.toLocaleString()}件</span>`;
                
                resetFilters();
                renderSummary();
                renderCompanyList();
            });
        }

        // ==========================================
        // タブ切替
        // ==========================================
        function switchTab(tabId) {
            document.getElementById('searchTab').classList.add('hidden');
            document.getElementById('companyListTab').classList.add('hidden');
            document.getElementById(tabId).classList.remove('hidden');
            
            const btnId = tabId === 'searchTab' ? 'btnSearchTab' : 'btnCompanyListTab';
            const otherBtnId = tabId === 'searchTab' ? 'btnCompanyListTab' : 'btnSearchTab';
            
            document.getElementById(btnId).className = "pb-2 px-1 text-sm tab-active focus:outline-none transition-colors";
            document.getElementById(otherBtnId).className = "pb-2 px-1 text-sm tab-inactive focus:outline-none transition-colors";

            if (tabId === 'companyListTab') renderCompanyList();
        }

        // ==========================================
        // 「トラブル検索」タブ ロジック（1次請・元請のコード/社名も完全照合）
        // ==========================================
        function applyFilters() {
            const query = normalizeStr(document.getElementById('searchInput').value);
            const termFrom = document.getElementById('filterTermFrom').value;
            const termTo = document.getElementById('filterTermTo').value;
            
            const presetVal = document.getElementById('filterTierPreset').value;
            let targetTier = '';
            let tierCondition = 'exact';
            if (presetVal) {
                const parts = presetVal.split('_');
                targetTier = parts[0];
                tierCondition = parts[1] || 'exact';
            }

            const isPartyOnly = document.getElementById('filterPartyOnly').checked;
            const isExcludeTanseiSole = document.getElementById('filterExcludeTanseiSole').checked;

            currentFilteredResults = validSearchData.filter(row => {
                if (query) {
                    // 当事者のコード・社名
                    const code = normalizeStr(formatCode7(row['トラブル発生会社_コード7桁']));
                    const formalName = normalizeStr(cleanCompanyName(row['トラブル発生会社_正式名称']));
                    const displayName = normalizeStr(cleanCompanyName(row['トラブル発生会社_表示名称']));
                    const rawDisplayName = normalizeStr(row['トラブル発生会社_表示名称']);

                    // 1次請けの社名・コード
                    const primeName = normalizeStr(row['1次請_会社名']);
                    const primeCode = normalizeStr(formatCode7(row['1次請_コード9桁'] || row['1次請_コード7桁']));

                    // 元請けの社名・コード
                    const motoName = normalizeStr(row['元請_会社名']);
                    const motoCode = normalizeStr(formatCode7(row['元請_コード9桁'] || row['元請_コード7桁']));

                    const isTargetMatch = code.includes(query) || formalName.includes(query) || displayName.includes(query) || rawDisplayName.includes(query);
                    const isPrimeMatch = (primeName && primeName !== '未登録' && primeName.includes(query)) || (primeCode && primeCode.includes(query));
                    const isMotoMatch = (motoName && motoName !== '未登録' && motoName.includes(query)) || (motoCode && motoCode.includes(query));

                    if (isPartyOnly) {
                        if (!isTargetMatch) return false;
                    } else {
                        if (!isTargetMatch && !isPrimeMatch && !isMotoMatch) return false;
                    }
                }
                
                if (!isWithinTerm(row['発生期'], termFrom, termTo)) return false;
                if (!matchesTierFilter(row['当事者請負階層'], targetTier, tierCondition)) return false;

                // 当事者が「丹青社」となっている自社トラブルのみピンポイントで除外
                if (isExcludeTanseiSole) {
                    const targetName = (row['トラブル発生会社_表示名称'] || row['トラブル発生会社_正式名称'] || '').toString();
                    if (targetName.includes('丹青社')) {
                        return false;
                    }
                }

                return true;
            });

            // デフォルトでクレーム№の降順ソート
            currentFilteredResults.sort((a, b) => getClaimNum(b) - getClaimNum(a));

            currentPage = 1;
            renderResults();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterTermFrom').value = '';
            document.getElementById('filterTermTo').value = '';
            document.getElementById('filterTierPreset').value = '';
            document.getElementById('filterPartyOnly').checked = false;
            document.getElementById('filterExcludeTanseiSole').checked = true;
            applyFilters();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderResults();
                document.getElementById('resultsContainer').scrollTop = 0;
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(currentFilteredResults.length / PAGE_SIZE) || 1;
            if (currentPage < totalPages) {
                currentPage++;
                renderResults();
                document.getElementById('resultsContainer').scrollTop = 0;
            }
        }

        function renderResults() {
            const container = document.getElementById('resultsContainer');
            const totalCount = currentFilteredResults.length;
            document.getElementById('resultCount').textContent = totalCount.toLocaleString();
            
            if (totalCount === 0) {
                document.getElementById('pageRangeText').textContent = '';
                document.getElementById('pageIndicator').textContent = '0 / 0';
                document.getElementById('btnPrevPage').disabled = true;
                document.getElementById('btnNextPage').disabled = true;

                container.innerHTML = `
                    <div class="p-8 text-center text-gray-400 bg-white rounded border border-gray-200 text-xs leading-relaxed">
                        条件に一致するトラブル履歴はありません<br>
                        <span class="text-gray-400 font-normal">※検索キーワードを変更するか、発生期を「全期間」にして再検索してください。</span>
                    </div>
                `;
                return;
            }

            const totalPages = Math.ceil(totalCount / PAGE_SIZE);
            if (currentPage > totalPages) currentPage = totalPages;

            const startIndex = (currentPage - 1) * PAGE_SIZE;
            const endIndex = Math.min(startIndex + PAGE_SIZE, totalCount);

            document.getElementById('pageRangeText').textContent = `（ ${(startIndex + 1).toLocaleString()} 〜 ${endIndex.toLocaleString()} 件目を表示 ）`;
            document.getElementById('pageIndicator').textContent = `${currentPage} / ${totalPages}`;
            document.getElementById('btnPrevPage').disabled = (currentPage === 1);
            document.getElementById('btnNextPage').disabled = (currentPage === totalPages);

            const displayResults = currentFilteredResults.slice(startIndex, endIndex);
            
            const htmlArray = displayResults.map(row => {
                const position = row['当社立ち位置区分'];
                let positionBadge = '<span class="px-2 py-0.5 text-xs font-medium rounded bg-gray-100 text-gray-700 border border-gray-200 shrink-0">当社元請以外</span>';
                if (position === '当社元請案件') positionBadge = '<span class="px-2 py-0.5 text-xs font-medium rounded bg-blue-100 text-blue-800 border border-blue-200 shrink-0">当社元請</span>';
                if (position === '当社一次請案件') positionBadge = '<span class="px-2 py-0.5 text-xs font-medium rounded bg-emerald-100 text-emerald-800 border border-emerald-200 shrink-0">ゼネコン元請（当社1次請）</span>';

                const warningBadge = row['階層入力疑義フラグ'] == '1' 
                    ? `<span class="ml-2 inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-red-50 text-red-700 border border-red-200 shrink-0 cursor-help" title="報告内容（請負階層）の誤り・記載不備が疑われるデータです。">⚠️ 階層疑義</span>` : '';

                const displayCompanyName = cleanCompanyName(row['トラブル発生会社_表示名称']);

                // 会社№の表記対応
                const rawCode = formatCode7(row['トラブル発生会社_コード7桁']);
                let codeBadge = '';
                if (rawCode && rawCode !== '未登録' && rawCode !== 'UNMAPPED' && rawCode !== '-') {
                    codeBadge = `<a href="http://tools.tanseisha.co.jp/corp/kyoryoku/list-kaisha.asp?ky=${encodeURIComponent(rawCode)}&sch=%8C%9F%8D%F5&smt=sch" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-xs text-slate-700 hover:text-slate-900 hover:underline bg-white hover:bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 font-mono shrink-0 whitespace-nowrap shadow-sm" title="協力会社マスターを開く">会社№${rawCode}</a>`;
                } else {
                    codeBadge = `<span class="inline-flex items-center text-xs text-gray-400 bg-white px-1.5 py-0.5 rounded border border-gray-200 font-mono shrink-0 whitespace-nowrap shadow-sm">会社№未記入</span>`;
                }

                // クレーム№バッジ
                const rawClaimNo = (row['クレーム№'] || row['クレームNo'] || row['クレームNO'] || '').toString().trim();
                const claimKey = rawClaimNo.replace(/[^0-9]/g, '') || rawClaimNo;
                const claimBadge = rawClaimNo 
                    ? `<a href="http://tools.tanseisha.co.jp/claim/list/default.asp?key=${encodeURIComponent(claimKey)}&hok_buky=&sbm=se" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-xs text-gray-700 hover:text-gray-900 font-medium bg-white px-1.5 py-0.5 rounded border border-gray-600 shrink-0 whitespace-nowrap shadow-sm"><svg class="w-3 h-3 mr-0.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>${rawClaimNo}</a>` : '';

                // 報告種別名バッジ
                const reportType = (row['報告種別名'] || '').toString().trim();
                const reportTypeBadge = reportType 
                    ? `<span class="inline-flex items-center text-xs text-white bg-slate-700 px-1.5 py-0.5 rounded font-medium shrink-0 whitespace-nowrap">${reportType}</span>` : '';

                // 無償補修区分名バッジ
                const repairType = (row['無償補修区分名'] || '').toString().trim();
                const repairTypeBadge = buildRepairBadge(repairType, row);

                const propertyName = (row['物件名'] || '').toString().trim() || '（物件名未登録）';
                const summaryText = (row['事象概要'] || '').toString().trim() || '記載なし';
                
                const flow = buildFlowString(row, displayCompanyName);

                return `
                    <div class="bg-white p-3 rounded-md border border-gray-200 shadow-sm hover:border-blue-300 transition-colors space-y-1.5">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 overflow-hidden flex-1">
                                <h3 class="text-base font-bold text-gray-900 shrink-0">${displayCompanyName}</h3>
                                ${claimBadge}
                                ${reportTypeBadge}
                                ${repairTypeBadge}
                                <div class="text-xs text-gray-600 truncate border-l border-gray-200 pl-2 cursor-help min-w-0 flex-1" title="物件名: ${propertyName}&#10;概要: ${summaryText}">
                                    <span class="text-gray-400">概要:</span> <span class="text-gray-800">${summaryText}</span>
                                </div>
                            </div>
                            ${positionBadge}
                        </div>
                        
                        <div class="text-xs text-gray-600 bg-slate-50 px-2 py-1 rounded border border-slate-100 flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 overflow-hidden flex-1 min-w-0">
                                ${codeBadge}
                                <div class="truncate cursor-help hover:text-gray-900 border-l border-slate-200 pl-2 flex-1" title="全文表示: ${flow.plain}">
                                    <span class="text-gray-400 font-medium">請負体制:</span> ${flow.html}
                                </div>
                            </div>
                            ${warningBadge}
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = htmlArray.join('');
        }

        // ==========================================
        // 「会社一覧」タブ ロジック（当事者 ＆ 下請管理の二軸集計＋元請対応）
        // ==========================================
        function toggleCompanyListSort(field) {
            if (companyListSortField === field) {
                companyListSortOrder = (companyListSortOrder === 'asc') ? 'desc' : 'asc';
            } else {
                companyListSortField = field;
                companyListSortOrder = (field === 'name' || field === 'code') ? 'asc' : 'desc';
            }
            renderCompanyList();
        }

        function getSortIcon(field) {
            if (companyListSortField !== field) return '<span class="text-gray-300 font-normal ml-0.5">▲▼</span>';
            return companyListSortOrder === 'asc' ? '<span class="text-blue-600 font-bold ml-0.5">▲</span>' : '<span class="text-blue-600 font-bold ml-0.5">▼</span>';
        }

        function resetCompanyListSearch() {
            const input = document.getElementById('companyListSearchInput');
            if (input) input.value = '';
            renderCompanyList();
        }

        function renderCompanyList() {
            const container = document.getElementById('companyListContainer');
            const summaryText = document.getElementById('companyListSummaryText');
            const filterText = normalizeStr(document.getElementById('companyListSearchInput')?.value);
            const termFrom = document.getElementById('companyListTermFrom')?.value || '';
            const termTo = document.getElementById('companyListTermTo')?.value || '';
            const isExcludeTansei = document.getElementById('companyListExcludeTansei').checked;
            
            if (validSearchData.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-xs">データがありません</div>`;
                return;
            }

            const filteredData = validSearchData.filter(row => isWithinTerm(row['発生期'], termFrom, termTo));
            const companyMap = new Map();

            filteredData.forEach(row => {
                const tName = cleanCompanyName(row['トラブル発生会社_表示名称']);
                const tCode = formatCode7(row['トラブル発生会社_コード7桁']);
                
                // 1. 当事者（事故発生会社）として集計
                const tKey = `${tName}___${tCode}`;
                if (!companyMap.has(tKey)) {
                    companyMap.set(tKey, { name: tName, code: tCode, targetCount: 0, primeCount: 0, motoCount: 0 });
                }
                companyMap.get(tKey).targetCount += 1;

                // 2. 1次請けとして集計
                const pName = cleanCompanyName(row['1次請_会社名']);
                const pCodeRaw = row['1次請_コード9桁'] || row['1次請_コード7桁'] || '';
                const pCode = formatCode7(pCodeRaw);

                if (pName && pName !== '未登録' && pName !== '（名称未設定）' && pName !== '-' && pName !== tName) {
                    let foundKey = null;
                    for (let [k, v] of companyMap.entries()) {
                        if (v.name === pName) { foundKey = k; break; }
                    }
                    if (!foundKey) {
                        foundKey = `${pName}___${pCode}`;
                        companyMap.set(foundKey, { name: pName, code: pCode, targetCount: 0, primeCount: 0, motoCount: 0 });
                    }
                    companyMap.get(foundKey).primeCount += 1;
                }

                // 3. 元請けとして集計（当事者とも1次請けとも異なる場合）
                const mName = cleanCompanyName(row['元請_会社名']);
                const mCodeRaw = row['元請_コード9桁'] || row['元請_コード7桁'] || '';
                const mCode = formatCode7(mCodeRaw);

                if (mName && mName !== '未登録' && mName !== '（名称未設定）' && mName !== '-' && mName !== tName && mName !== pName) {
                    let foundKey = null;
                    for (let [k, v] of companyMap.entries()) {
                        if (v.name === mName) { foundKey = k; break; }
                    }
                    if (!foundKey) {
                        foundKey = `${mName}___${mCode}`;
                        companyMap.set(foundKey, { name: mName, code: mCode, targetCount: 0, primeCount: 0, motoCount: 0 });
                    }
                    companyMap.get(foundKey).motoCount += 1;
                }
            });

            // マップから配列へ変換（丹青社除外フィルターの適用）
            let list = [];
            for (let item of companyMap.values()) {
                if (isExcludeTansei && item.name.includes('丹青社')) {
                    continue; // 丹青社を除外
                }
                
                const managedCount = item.primeCount + item.motoCount; // 下請管理合計
                const total = item.targetCount + managedCount; // 総関与合計
                
                if (total > 0) {
                    list.push({ ...item, managedCount: managedCount, totalCount: total });
                }
            }

            if (filterText) {
                list = list.filter(item => normalizeStr(item.name).includes(filterText) || normalizeStr(item.code).includes(filterText));
            }

            // 並び替え処理
            list.sort((a, b) => {
                let valA, valB;
                if (companyListSortField === 'name') {
                    return companyListSortOrder === 'asc' ? a.name.localeCompare(b.name, 'ja') : b.name.localeCompare(a.name, 'ja');
                } else if (companyListSortField === 'code') {
                    valA = (a.code && a.code !== '未登録' && a.code !== 'UNMAPPED' && a.code !== '未記入') ? a.code : '9999999';
                    valB = (b.code && b.code !== '未登録' && b.code !== 'UNMAPPED' && b.code !== '未記入') ? b.code : '9999999';
                    return companyListSortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else if (companyListSortField === 'targetCount') {
                    return companyListSortOrder === 'asc' ? a.targetCount - b.targetCount : b.targetCount - a.targetCount;
                } else if (companyListSortField === 'primeCount') { // 下請管理列のソートはmanagedCountを使う
                    return companyListSortOrder === 'asc' ? a.managedCount - b.managedCount : b.managedCount - a.managedCount;
                } else if (companyListSortField === 'totalCount') {
                    return companyListSortOrder === 'asc' ? a.totalCount - b.totalCount : b.totalCount - a.totalCount;
                }
                return 0;
            });

            const sumTarget = list.reduce((sum, item) => sum + item.targetCount, 0);
            const sumManaged = list.reduce((sum, item) => sum + item.managedCount, 0);
            const sumTotal = list.reduce((sum, item) => sum + item.totalCount, 0);

            if (summaryText) {
                summaryText.innerHTML = `集計会社数: <span class="text-blue-600 font-bold text-sm">${list.length.toLocaleString()}</span> 社 （関与トラブル計 <span class="text-gray-900 font-bold text-sm">${sumTotal.toLocaleString()}</span> 件 <span class="text-gray-500 font-normal text-xs">［当事者 ${sumTarget.toLocaleString()} 件 / 下請管理 ${sumManaged.toLocaleString()} 件］</span>）`;
            }

            if (list.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-xs">該当する会社は見つかりませんでした</div>`;
                return;
            }

            let html = `
                <div class="bg-white rounded overflow-hidden h-full flex flex-col">
                    <div class="overflow-y-auto flex-1 relative">
                        <table class="w-full divide-y divide-gray-200 text-xs table-fixed">
                            <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm border-b border-gray-200">
                                <tr>
                                    <th scope="col" onclick="toggleCompanyListSort('code')" class="w-[18%] px-3 py-2.5 text-left text-gray-700 font-bold cursor-pointer hover:bg-slate-100 select-none transition-colors">協力会社№ ${getSortIcon('code')}</th>
                                    <th scope="col" onclick="toggleCompanyListSort('name')" class="w-[42%] px-3 py-2.5 text-left text-gray-700 font-bold cursor-pointer hover:bg-slate-100 select-none transition-colors">協力会社名 ${getSortIcon('name')}</th>
                                    <th scope="col" onclick="toggleCompanyListSort('targetCount')" class="w-[12%] px-2 py-2.5 text-right text-gray-700 font-bold cursor-pointer hover:bg-slate-100 select-none transition-colors" title="自社が直接トラブルを起した案件数">当事者 ${getSortIcon('targetCount')}</th>
                                    <th scope="col" onclick="toggleCompanyListSort('primeCount')" class="w-[14%] px-2 py-2.5 text-right text-gray-700 font-bold cursor-pointer hover:bg-slate-100 select-none transition-colors" title="上位階層（元請/1次請）として下請けのトラブルを管理した件数">下請管理 ${getSortIcon('primeCount')}</th>
                                    <th scope="col" onclick="toggleCompanyListSort('totalCount')" class="w-[14%] px-3 py-2.5 text-right text-gray-700 font-bold cursor-pointer hover:bg-slate-100 select-none transition-colors" title="関与した全トラブルの合計件数">総関与件数 ${getSortIcon('totalCount')}</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-100">
            `;

            const rowsHtml = list.map(item => {
                const rawDisplayCode = (item.code && item.code !== '未登録' && item.code !== 'UNMAPPED') ? item.code : '';
                const displayCode = rawDisplayCode ? `会社№${rawDisplayCode}` : '会社№未記入';
                const codeBadgeClass = (rawDisplayCode !== '') 
                    ? 'inline-flex items-center text-xs text-slate-700 bg-white px-1.5 py-0.5 rounded border border-slate-200 font-mono'
                    : 'inline-flex items-center text-xs text-gray-400 bg-white px-1.5 py-0.5 rounded border border-gray-200 font-mono';

                // 当事者（自社事故）：標準の濃いグレー文字
                const targetCell = item.targetCount > 0 
                    ? `<span class="font-bold text-gray-800">${item.targetCount.toLocaleString()}</span> <span class="text-gray-400 font-normal text-[11px]">件</span>` 
                    : `<span class="text-gray-300">-</span>`;

                // 下請管理（管理責任）：内訳カッコ書きを排除してスッキリ数値のみ表示
                const primeCell = item.managedCount > 0 
                    ? `<span class="font-bold text-gray-800">${item.managedCount.toLocaleString()}</span> <span class="text-gray-400 font-normal text-[11px]">件</span>` 
                    : `<span class="text-gray-300">-</span>`;

                // 総関与件数：赤文字で強調
                const totalCell = `<span class="font-bold text-red-600 text-sm">${item.totalCount.toLocaleString()}</span> <span class="text-gray-400 font-normal text-[11px]">件</span>`;

                return `
                    <tr data-name="${item.name}" data-code="${item.code}" onclick="handleCompanyListRowClick(this)" class="hover:bg-blue-50/70 cursor-pointer transition-colors group">
                        <td class="px-3 py-2.5 truncate align-middle"><span class="${codeBadgeClass}">${displayCode}</span></td>
                        <td class="px-3 py-2.5 font-bold text-gray-900 group-hover:text-blue-600 group-hover:underline truncate align-middle">${item.name}</td>
                        <td class="px-2 py-2.5 text-right truncate align-middle">${targetCell}</td>
                        <td class="px-2 py-2.5 text-right truncate align-middle">${primeCell}</td>
                        <td class="px-3 py-2.5 text-right truncate align-middle">${totalCell}</td>
                    </tr>
                `;
            }).join('');

            html += rowsHtml + `</tbody></table></div></div>`;
            container.innerHTML = html;
        }

        function handleCompanyListRowClick(trElement) {
            const name = trElement.getAttribute('data-name');
            const code = formatCode7(trElement.getAttribute('data-code'));

            switchTab('searchTab');

            document.getElementById('filterTermFrom').value = document.getElementById('companyListTermFrom').value;
            document.getElementById('filterTermTo').value = document.getElementById('companyListTermTo').value;
            document.getElementById('filterTierPreset').value = '';
            
            // 下請管理事故も含めて全件ヒットさせるため「当事者限定」チェックを自動OFF
            document.getElementById('filterPartyOnly').checked = false;

            // もし丹青社をクリックした場合は、検索タブの自社除外フィルターも自動でOFFにする
            if (name.includes('丹青社')) {
                document.getElementById('filterExcludeTanseiSole').checked = false;
            }

            document.getElementById('searchInput').value = (code && code !== '未登録' && code !== 'UNMAPPED' && code !== '未記入') ? code : name;

            applyFilters();
        }

        // ==========================================
        // サマリー描画
        // ==========================================
        function renderSummary() {
            const container = document.getElementById('summaryContainer');
            if (!globalData || globalData.length === 0) return;

            const categoryCounts = {};
            unmappedData.forEach(row => {
                const cat = row['トラブル発生会社_UNMAPPED詳細区分'] || '区分未設定';
                categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
            });

            const sortedCategories = Object.keys(categoryCounts).sort();
            
            const itemsHtml = sortedCategories.map((cat, idx) => {
                let cleanCat = cat.replace(/[【】]/g, '')
                                  .replace('自社（社内対応）', '社内対応')
                                  .replace('協力会社指定なし', '指定なし')
                                  .replace('協力会社不明', '会社不明');
                return `
                    <div class="inline-flex items-center whitespace-nowrap">
                        <span class="text-gray-500">${cleanCat}:</span>
                        <strong class="text-gray-800 ml-1 font-bold">${categoryCounts[cat].toLocaleString()}</strong><span class="text-gray-400 text-[11px] ml-0.5">件</span>
                        ${idx < sortedCategories.length - 1 ? '<span class="text-gray-300 mx-2">|</span>' : ''}
                    </div>
                `;
            }).join('');

            container.innerHTML = `<div class="flex flex-wrap items-center justify-end text-xs text-gray-600">${itemsHtml}</div>`;
        }
    </script>
</body>
</html>
