<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>協力会社過去トラブル検索ツール</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html { font-size: 110%; } /* 全体フォントサイズ110% */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #64748b; }
        .tab-inactive:hover { color: #334155; border-bottom: 2px solid #cbd5e1; }
    </style>
</head>
<body class="text-gray-800 text-sm h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 py-3 px-5 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            <h1 class="text-lg font-bold text-gray-900">協力会社過去トラブル検索ツール</h1>
        </div>
        <div class="flex items-center gap-4">
            <div id="dataStatus" class="text-sm text-gray-500 flex items-center gap-1.5">
                <svg class="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <span>データ読み込み中...</span>
            </div>
            <span class="text-xs text-gray-500 font-medium cursor-help" title="このツールはベータ版です個別データは直接報告データを確認のこと">※64～69期7月までのDWHテストデータにて構築</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-hidden flex flex-col p-4 max-w-4xl mx-auto w-full">
        
        <!-- Tabs -->
        <div class="flex space-x-6 border-b border-gray-200 mb-4 shrink-0">
            <button id="btnSearchTab" class="pb-2 px-1 text-sm tab-active focus:outline-none transition-colors" onclick="switchTab('searchTab')">協力会社検索</button>
            <button id="btnCompanyListTab" class="pb-2 px-1 text-sm tab-inactive focus:outline-none transition-colors" onclick="switchTab('companyListTab')">協力会社一覧</button>
        </div>

        <!-- Tab Content: Search -->
        <div id="searchTab" class="flex-1 flex flex-col overflow-hidden">
            <!-- Search Panel -->
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-4 shrink-0 space-y-3">
                <div class="flex flex-wrap items-center gap-3">
                    <div class="flex items-center gap-1.5 shrink-0">
                        <label class="text-xs font-medium text-gray-700 whitespace-nowrap">発生期:</label>
                        <select id="filterTermFrom" class="w-28 pl-2 pr-6 py-1.5 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" onchange="applyFilters()">
                            <option value="">全期間</option><option value="64">64期</option><option value="65">65期</option><option value="66">66期</option><option value="67">67期</option><option value="68">68期</option><option value="69">69期</option>
                        </select>
                        <span class="text-xs text-gray-400">〜</span>
                        <select id="filterTermTo" class="w-28 pl-2 pr-6 py-1.5 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" onchange="applyFilters()">
                            <option value="">全期間</option><option value="64">64期</option><option value="65">65期</option><option value="66">66期</option><option value="67">67期</option><option value="68">68期</option><option value="69">69期</option>
                        </select>
                    </div>
                    <div class="flex-1 min-w-[200px] relative">
                        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="text" id="searchInput" class="w-full pl-8 pr-3 py-1.5 text-xs border border-gray-300 rounded bg-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="協力会社名、協力会社№(7桁)、1次請会社名...">
                    </div>
                    <button onclick="applyFilters()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded text-xs font-medium shadow-sm transition-colors shrink-0">検索</button>
                    <button onclick="resetFilters()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded text-xs font-medium transition-colors shrink-0">リセット</button>
                    <button onclick="switchTab('companyListTab')" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded text-xs font-medium transition-colors shrink-0 flex items-center gap-1 border border-slate-200">
                        <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        <span>一覧に戻る</span>
                    </button>
                </div>

                <details class="group border-t border-gray-100 pt-2">
                    <summary class="flex items-center gap-1.5 text-xs text-gray-600 cursor-pointer select-none font-medium hover:text-blue-600 w-max">
                        <svg class="w-3.5 h-3.5 transition-transform group-open:rotate-180 text-gray-400 group-hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        <span>詳細フィルター条件 ＆ 分析除外データ内訳</span>
                    </summary>
                    <div class="space-y-3 pt-3">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">当事者の請負階層</label>
                                <select id="filterTier" class="w-full pl-2 pr-6 py-1 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" onchange="applyFilters()">
                                    <option value="">すべて</option>
                                    <option value="元請">元請</option>
                                    <option value="1次請">1次請</option>
                                    <option value="2次請">2次請</option>
                                    <option value="3次請">3次請</option>
                                    <option value="4次請">4次請</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-gray-600 mb-1">範囲・絞り込み条件</label>
                                <select id="filterTierCondition" class="w-full pl-2 pr-6 py-1 text-xs border border-gray-300 rounded bg-white focus:outline-none focus:ring-1 focus:ring-blue-500" onchange="applyFilters()">
                                    <option value="exact">と「一致」</option>
                                    <option value="below">「以下（多重下請・深層）」</option>
                                    <option value="above">「以上（上位・浅層）」</option>
                                </select>
                            </div>
                            <div class="flex items-end pb-1">
                                <label class="flex items-center cursor-pointer">
                                    <input type="checkbox" id="filterComplete" class="h-3.5 w-3.5 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" onchange="applyFilters()">
                                    <span class="ml-1.5 text-xs text-gray-700">入力データ高信頼のみ（未クレンジング）</span>
                                </label>
                            </div>
                        </div>
                        <div class="border-t border-gray-100 pt-2 flex items-center gap-2">
                            <span class="text-xs text-gray-400 font-medium whitespace-nowrap">分析除外データ:</span>
                            <div id="summaryContainer" class="flex-1 text-xs text-gray-400">読み込み中...</div>
                        </div>
                    </div>
                </details>
            </div>

            <div class="flex justify-between items-center mb-2 px-1 shrink-0">
                <h2 class="text-xs font-semibold text-gray-700">検索結果: <span id="resultCount" class="text-blue-600 font-bold text-sm">0</span> 件</h2>
                <div class="text-xs text-gray-400">※ 協力会社データのみ表示（個人・社内対応等を除く）</div>
            </div>

            <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="resultsContainer">
                <div class="p-8 text-center text-gray-400 bg-white rounded border border-gray-200 text-xs">条件に一致するトラブル履歴はありません</div>
            </div>
        </div>

        <!-- Tab Content: Company List -->
        <div id="companyListTab" class="hidden flex-1 flex flex-col overflow-hidden">
            <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-4 shrink-0 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h2 class="text-sm font-semibold text-gray-800">協力会社一覧</h2>
                    <p class="text-xs text-gray-400 mt-0.5">見出し（▲▼）で並び替えが可能です。行をクリックすると詳細検索へ移動します。</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex items-center gap-1 shrink-0">
                        <label class="text-xs text-gray-600 whitespace-nowrap">発生期:</label>
                        <select id="companyListTermFrom" class="w-24 pl-2 pr-5 py-1.5 text-xs border border-gray-300 rounded bg-white" onchange="renderCompanyList()">
                            <option value="">全期間</option><option value="64">64期</option><option value="65">65期</option><option value="66">66期</option><option value="67">67期</option><option value="68">68期</option><option value="69">69期</option>
                        </select>
                        <span class="text-xs text-gray-400">〜</span>
                        <select id="companyListTermTo" class="w-28 pl-2 pr-5 py-1.5 text-xs border border-gray-300 rounded bg-white" onchange="renderCompanyList()">
                            <option value="">全期間</option><option value="64">64期</option><option value="65">65期</option><option value="66">66期</option><option value="67">67期</option><option value="68">68期</option><option value="69">69期</option>
                        </select>
                    </div>
                    <div class="w-56 relative">
                        <div class="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        </div>
                        <input type="text" id="companyListSearchInput" oninput="renderCompanyList()" class="w-full pl-8 pr-3 py-1.5 text-xs border border-gray-300 rounded bg-white placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-blue-500" placeholder="会社名・協力会社№...">
                    </div>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto bg-white rounded-lg shadow-sm border border-gray-200">
                <div id="companyListContainer" class="w-full relative h-full">
                    <div class="p-8 text-center text-gray-400 text-xs">データを読み込んでください</div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==========================================
        // グローバル状態管理
        // ==========================================
        let globalData = [];
        let validSearchData = [];
        let unmappedData = [];
        let companyListSortField = 'name'; 
        let companyListSortOrder = 'asc';  

        const TIER_MAP = { '元請': 0, '1次請': 1, '2次請': 2, '3次請': 3, '4次請': 4, '5次請': 5 };

        // ==========================================
        // ヘルパー関数群
        // ==========================================

        const normalizeStr = (str) => {
            if (!str) return '';
            return str.toString()
                .normalize('NFKC')
                .toLowerCase()
                .trim();
        };

        const cleanCompanyName = (nameStr) => {
            if (!nameStr) return '（名称未設定）';
            return nameStr.toString().replace(/^【.*?】\s*/, '').trim() || '（名称未設定）';
        };

        const isWithinTerm = (termStr, termFrom, termTo) => {
            if (!termFrom && !termTo) return true;
            const match = (termStr || '').toString().match(/\d+/);
            if (!match) return false;
            const num = parseInt(match[0], 10);
            if (termFrom && num < parseInt(termFrom, 10)) return false;
            if (termTo && num > parseInt(termTo, 10)) return false;
            return true;
        };

        // 階層フィルター判定処理（純粋関数化）
        const matchesTierFilter = (rawRowTier, targetTier, condition) => {
            if (!targetTier) return true;

            const normalizedRowTier = (rawRowTier || '').toString().trim()
                .replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));

            const rowIndex = TIER_MAP[normalizedRowTier];
            const targetIndex = TIER_MAP[targetTier];

            if (rowIndex === undefined || targetIndex === undefined) return false;

            if (condition === 'exact') return rowIndex === targetIndex;
            if (condition === 'below') return rowIndex >= targetIndex; // 例: 2次請「以下」-> 2, 3, 4, 5次請
            if (condition === 'above') return rowIndex <= targetIndex; // 例: 2次請「以上」-> 元請, 1次請, 2次請

            return false;
        };

        // 請負体制の文字列（HTML版・プレーンテキスト版）を生成
        const buildFlowString = (row, displayCompanyName) => {
            const rawTargetTier = (row['当事者請負階層'] || '').toString().trim();
            const targetTier = rawTargetTier.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
            
            const targetIndex = TIER_MAP[targetTier] !== undefined ? TIER_MAP[targetTier] : -1;
            
            let htmlArray = [];
            let plainArray = [];
            
            if (targetIndex >= 0) {
                const tierCols = ['元請_会社名', '1次請_会社名', '2次請_会社名', '3次請_会社名', '4次請_会社名', '5次請_会社名'];
                const tierLabels = ['元請', '1次請', '2次請', '3次請', '4次請', '5次請'];
                
                let allUnregisteredSoFar = true;

                for (let i = 0; i <= targetIndex; i++) {
                    let isTarget = (i === targetIndex);
                    let compName = (row[tierCols[i]] || '').toString().trim();
                    if (!compName) compName = '未登録';

                    if (isTarget) {
                        htmlArray.push(`<span class="font-bold text-gray-900">[${tierLabels[i]}(当事者)] ${displayCompanyName}</span>`);
                        plainArray.push(`[${tierLabels[i]}(当事者)] ${displayCompanyName}`);
                        break;
                    } else {
                        if (compName !== '未登録') {
                            allUnregisteredSoFar = false;
                            htmlArray.push(`[${tierLabels[i]}] ${compName}`);
                            plainArray.push(`[${tierLabels[i]}] ${compName}`);
                        } else {
                            if (i === 0) {
                                htmlArray.push(`[元請] 未登録`);
                                plainArray.push(`[元請] 未登録`);
                            } else if (!allUnregisteredSoFar) {
                                htmlArray.push(`[${tierLabels[i]}] 未登録`);
                                plainArray.push(`[${tierLabels[i]}] 未登録`);
                            }
                        }
                    }
                }
            } else {
                const motoName = (row['元請_会社名'] || '').toString().trim() || '未登録';
                const priName = (row['1次請_会社名'] || '').toString().trim() || '未登録';
                
                if (motoName === displayCompanyName || rawTargetTier === '元請') {
                    htmlArray.push(`<span class="font-bold text-gray-900">[元請(当事者)] ${displayCompanyName}</span>`);
                    plainArray.push(`[元請(当事者)] ${displayCompanyName}`);
                } else {
                    htmlArray.push(`[元請] ${motoName}`);
                    plainArray.push(`[元請] ${motoName}`);
                    if (priName === displayCompanyName || rawTargetTier.includes('1次請') || rawTargetTier.includes('１次請')) {
                        htmlArray.push(`<span class="font-bold text-gray-900">[1次請(当事者)] ${displayCompanyName}</span>`);
                        plainArray.push(`[1次請(当事者)] ${displayCompanyName}`);
                    } else {
                        if (priName !== '未登録' || motoName !== '未登録') {
                            htmlArray.push(`[1次請] ${priName}`);
                            plainArray.push(`[1次請] ${priName}`);
                        }
                        htmlArray.push(`<span class="font-bold text-gray-900">[当事者(${rawTargetTier || '不明'})] ${displayCompanyName}</span>`);
                        plainArray.push(`[当事者(${rawTargetTier || '不明'})] ${displayCompanyName}`);
                    }
                }
            }
            return {
                html: htmlArray.join(' ＞ '),
                plain: plainArray.join(' ＞ ')
            };
        };

        // ==========================================
        // 初期化・データロード処理
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            loadDataFromSpreadsheet();
        });

        function loadDataFromSpreadsheet() {
            document.getElementById('dataStatus').innerHTML = `
                <div class="flex items-center gap-1.5">
                    <svg class="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>読み込み中...</span>
                </div>
            `;
            
            google.script.run
                .withSuccessHandler(processData)
                .withFailureHandler((err) => {
                    console.error("Data Load Error:", err);
                    document.getElementById('dataStatus').innerHTML = `<span class="text-red-500">エラー: ${err.message || '読込失敗'}</span>`;
                })
                .getSpreadsheetData();
        }

        function processData(data) {
            globalData = data;
            
            validSearchData = data.filter(row => {
                const unmapped = row['トラブル発生会社_UNMAPPED詳細区分'];
                return unmapped === '【正規登録会社】' || unmapped === '【コード未登録会社】';
            });
            
            unmappedData = data.filter(row => {
                const unmapped = row['トラブル発生会社_UNMAPPED詳細区分'];
                return unmapped !== '【正規登録会社】' && unmapped !== '【コード未登録会社】';
            });

            document.getElementById('dataStatus').innerHTML = `<span class="text-green-600 font-medium">読込: ${data.length.toLocaleString()}件</span>`;
            
            resetFilters();
            renderSummary();
            renderCompanyList();
        }

        // ==========================================
        // タブ制御
        // ==========================================
        function switchTab(tabId) {
            document.getElementById('searchTab').classList.add('hidden');
            document.getElementById('companyListTab').classList.add('hidden');
            document.getElementById(tabId).classList.remove('hidden');
            
            const btnId = tabId === 'searchTab' ? 'btnSearchTab' : 'btnCompanyListTab';
            const otherBtnId = tabId === 'searchTab' ? 'btnCompanyListTab' : 'btnSearchTab';
            
            document.getElementById(btnId).className = "pb-2 px-1 text-sm tab-active focus:outline-none transition-colors";
            document.getElementById(otherBtnId).className = "pb-2 px-1 text-sm tab-inactive focus:outline-none transition-colors";

            if (tabId === 'companyListTab') renderCompanyList();
        }

        // ==========================================
        // 検索・フィルタリング処理
        // ==========================================
        function applyFilters() {
            const query = normalizeStr(document.getElementById('searchInput').value);
            const termFrom = document.getElementById('filterTermFrom').value;
            const termTo = document.getElementById('filterTermTo').value;
            const targetTier = document.getElementById('filterTier').value;
            const tierCondition = document.getElementById('filterTierCondition').value;
            const isComplete = document.getElementById('filterComplete').checked;

            const results = validSearchData.filter(row => {
                // 1. キーワード判定
                if (query) {
                    const code = normalizeStr(row['トラブル発生会社_コード7桁']);
                    const formalName = normalizeStr(cleanCompanyName(row['トラブル発生会社_正式名称']));
                    const displayName = normalizeStr(cleanCompanyName(row['トラブル発生会社_表示名称']));
                    const rawDisplayName = normalizeStr(row['トラブル発生会社_表示名称']);
                    const primeName = normalizeStr(row['1次請_会社名']);

                    if (!(code.includes(query) || formalName.includes(query) || displayName.includes(query) || rawDisplayName.includes(query) || primeName.includes(query))) {
                        return false;
                    }
                }
                
                // 2. 発生期判定
                if (!isWithinTerm(row['発生期'], termFrom, termTo)) return false;

                // 3. 当事者階層・範囲条件判定（新ロジック）
                if (!matchesTierFilter(row['当事者請負階層'], targetTier, tierCondition)) return false;

                // 4. 商流チェーン完備フラグ判定
                if (isComplete && row['商流チェーン完備フラグ'] !== '1' && row['商流チェーン完備フラグ'] !== 1) return false;

                return true;
            });

            renderResults(results);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterTermFrom').value = '';
            document.getElementById('filterTermTo').value = '';
            document.getElementById('filterTier').value = '';
            document.getElementById('filterTierCondition').value = 'exact';
            document.getElementById('filterComplete').checked = false;
            applyFilters();
        }

        // ==========================================
        // 検索結果の描画
        // ==========================================
        function renderResults(results) {
            const container = document.getElementById('resultsContainer');
            document.getElementById('resultCount').textContent = results.length.toLocaleString();
            
            if (results.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 bg-white rounded border border-gray-200 text-xs">条件に一致するトラブル履歴はありません</div>`;
                return;
            }

            const displayResults = results.slice(0, 500); 
            
            const htmlArray = displayResults.map(row => {
                const position = row['当社立ち位置区分'];
                let positionBadge = '<span class="px-2 py-0.5 text-xs font-medium rounded bg-gray-100 text-gray-700 border border-gray-200 shrink-0">当社元請外または不明</span>';
                if (position === '当社元請案件') positionBadge = '<span class="px-2 py-0.5 text-xs font-medium rounded bg-blue-100 text-blue-800 border border-blue-200 shrink-0">当社元請</span>';
                if (position === '当社一次請案件') positionBadge = '<span class="px-2 py-0.5 text-xs font-medium rounded bg-emerald-100 text-emerald-800 border border-emerald-200 shrink-0">ゼネコン元請（当社1次請）</span>';

                const warningBadge = row['階層入力疑義フラグ'] == '1' 
                    ? `<span class="ml-2 inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-red-50 text-red-700 border border-red-200 shrink-0 cursor-help" title="報告内容（請負階層）の誤り・記載不備が疑われるデータです。">⚠️ 階層疑義</span>` : '';

                const displayCompanyName = cleanCompanyName(row['トラブル発生会社_表示名称']);

                const rawCode = (row['トラブル発生会社_コード7桁'] || '').toString().trim();
                const codeBadge = (rawCode && rawCode !== '未登録' && rawCode !== 'UNMAPPED') 
                    ? `<span class="text-xs text-gray-600 bg-gray-100 px-1.5 py-0.5 rounded border border-gray-200 font-mono">${rawCode}</span>` : '';

                const rawClaimNo = (row['クレーム№'] || row['クレームNo'] || row['クレームNO'] || '').toString().trim();
                const claimKey = rawClaimNo.replace(/[^0-9]/g, '') || rawClaimNo;
                const claimBadge = rawClaimNo 
                    ? `<a href="http://tools.tanseisha.co.jp/claim/list/default.asp?key=${encodeURIComponent(claimKey)}&hok_buky=&sbm=se" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-xs text-blue-600 hover:text-blue-800 hover:underline font-medium bg-blue-50 px-1.5 py-0.5 rounded border border-blue-100"><svg class="w-3 h-3 mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>${rawClaimNo}</a>` : '';

                const reportType = (row['報告種別名'] || '').toString().trim();
                const reportTypeBadge = reportType 
                    ? `<span class="inline-flex items-center text-xs text-purple-700 bg-purple-50 px-1.5 py-0.5 rounded border border-purple-100 font-medium shrink-0">${reportType}</span>` : '';

                const propertyName = row['物件名'] || '（物件名未登録）';
                const summaryText = row['事象概要'] || '記載なし';
                
                const flow = buildFlowString(row, displayCompanyName);

                return `
                    <div class="bg-white p-3 rounded-md border border-gray-200 shadow-sm hover:border-blue-300 transition-colors space-y-1.5">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 overflow-hidden flex-1">
                                <h3 class="text-base font-bold text-gray-900 shrink-0">${displayCompanyName}</h3>
                                ${codeBadge}
                                ${claimBadge}
                                ${reportTypeBadge}
                                <div class="text-xs text-gray-600 truncate border-l border-gray-200 pl-2 cursor-help" title="物件名: ${propertyName}&#10;概要: ${summaryText}">
                                    <span class="text-gray-400">概要:</span> ${summaryText}
                                </div>
                            </div>
                            ${positionBadge}
                        </div>
                        
                        <div class="text-xs text-gray-600 bg-slate-50 px-2.5 py-1 rounded border border-slate-100 flex items-center justify-between">
                            <div class="truncate mr-2 cursor-help hover:text-gray-900" title="全文表示: ${flow.plain}">
                                <span class="text-gray-400 font-medium">請負体制:</span> ${flow.html}
                            </div>
                            ${warningBadge}
                        </div>
                    </div>
                `;
            });
            
            let html = htmlArray.join('');
            if (results.length > 500) {
                html += `<div class="p-2 text-center text-xs text-gray-400 bg-gray-50 rounded">※ 上位500件のみ表示中</div>`;
            }
            container.innerHTML = html;
        }

        // ==========================================
        // 協力会社一覧の描画・制御
        // ==========================================
        function toggleCompanyListSort(field) {
            if (companyListSortField === field) {
                companyListSortOrder = (companyListSortOrder === 'asc') ? 'desc' : 'asc';
            } else {
                companyListSortField = field;
                companyListSortOrder = (field === 'count') ? 'desc' : 'asc';
            }
            renderCompanyList();
        }

        function getSortIcon(field) {
            if (companyListSortField !== field) return '<span class="text-gray-300 font-normal">▲▼</span>';
            return companyListSortOrder === 'asc' ? '<span class="text-blue-600 font-bold">▲</span>' : '<span class="text-blue-600 font-bold">▼</span>';
        }

        function renderCompanyList() {
            const container = document.getElementById('companyListContainer');
            const filterText = normalizeStr(document.getElementById('companyListSearchInput')?.value);
            const termFrom = document.getElementById('companyListTermFrom')?.value || '';
            const termTo = document.getElementById('companyListTermTo')?.value || '';
            
            if (validSearchData.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-xs">データがありません</div>`;
                return;
            }

            const filteredData = validSearchData.filter(row => isWithinTerm(row['発生期'], termFrom, termTo));

            const companyMap = new Map();
            filteredData.forEach(row => {
                const name = cleanCompanyName(row['トラブル発生会社_表示名称']);
                const code = (row['トラブル発生会社_コード7桁'] || '').toString().trim();
                const key = `${name}___${code}`;

                if (!companyMap.has(key)) companyMap.set(key, { name, code, count: 0 });
                companyMap.get(key).count += 1;
            });

            let list = Array.from(companyMap.values());

            if (filterText) {
                list = list.filter(item => normalizeStr(item.name).includes(filterText) || normalizeStr(item.code).includes(filterText));
            }

            list.sort((a, b) => {
                let valA, valB;
                if (companyListSortField === 'name') {
                    return companyListSortOrder === 'asc' ? a.name.localeCompare(b.name, 'ja') : b.name.localeCompare(a.name, 'ja');
                } else if (companyListSortField === 'code') {
                    valA = (a.code && a.code !== '未登録' && a.code !== 'UNMAPPED') ? a.code : '9999999';
                    valB = (b.code && b.code !== '未登録' && b.code !== 'UNMAPPED') ? b.code : '9999999';
                    return companyListSortOrder === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else if (companyListSortField === 'count') {
                    return companyListSortOrder === 'asc' ? a.count - b.count : b.count - a.count;
                }
                return 0;
            });

            const totalClaims = list.reduce((sum, item) => sum + item.count, 0);

            if (list.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-400 text-xs">該当する協力会社は見つかりませんでした</div>`;
                return;
            }

            let html = `
                <div class="bg-white rounded overflow-hidden h-full flex flex-col">
                    <div class="bg-gray-50 px-4 py-2 text-xs text-gray-600 font-medium border-b border-gray-200 flex justify-between items-center shrink-0">
                        <span>該当 <strong class="text-blue-600 font-bold">${list.length.toLocaleString()}</strong> 社（合計 <strong class="text-red-600 font-bold">${totalClaims.toLocaleString()}</strong> 件のトラブル）</span>
                        <span class="text-gray-400 text-[11px]">※行をクリックすると該当会社の検索画面へ移動します</span>
                    </div>
                    <div class="overflow-y-auto flex-1 relative">
                        <table class="min-w-full divide-y divide-gray-200 text-xs">
                            <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm border-b border-gray-200">
                                <tr>
                                    <th scope="col" onclick="toggleCompanyListSort('name')" class="px-4 py-2 text-left text-gray-600 font-semibold cursor-pointer hover:bg-gray-100 select-none transition-colors">協力会社名 ${getSortIcon('name')}</th>
                                    <th scope="col" onclick="toggleCompanyListSort('code')" class="px-4 py-2 text-left text-gray-600 font-semibold cursor-pointer hover:bg-gray-100 select-none transition-colors">協力会社№ ${getSortIcon('code')}</th>
                                    <th scope="col" onclick="toggleCompanyListSort('count')" class="px-4 py-2 text-right text-gray-600 font-semibold cursor-pointer hover:bg-gray-100 select-none transition-colors">トラブル件数 ${getSortIcon('count')}</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-100">
            `;

            const rowsHtml = list.map(item => {
                const displayCode = (item.code && item.code !== '未登録' && item.code !== 'UNMAPPED') ? item.code : '-';
                return `
                    <tr data-name="${item.name}" data-code="${item.code}" onclick="handleCompanyListRowClick(this)" class="hover:bg-blue-50 cursor-pointer transition-colors">
                        <td class="px-4 py-2.5 font-semibold text-blue-600 hover:underline">${item.name}</td>
                        <td class="px-4 py-2.5 text-gray-500 font-mono">${displayCode}</td>
                        <td class="px-4 py-2.5 text-right font-bold text-red-600">${item.count.toLocaleString()} <span class="text-gray-400 font-normal">件</span></td>
                    </tr>
                `;
            }).join('');

            html += rowsHtml + `</tbody></table></div></div>`;
            container.innerHTML = html;
        }

        function handleCompanyListRowClick(trElement) {
            const name = trElement.getAttribute('data-name');
            const code = trElement.getAttribute('data-code');

            switchTab('searchTab');

            document.getElementById('filterTermFrom').value = document.getElementById('companyListTermFrom').value;
            document.getElementById('filterTermTo').value = document.getElementById('companyListTermTo').value;
            document.getElementById('filterTier').value = '';
            document.getElementById('filterTierCondition').value = 'exact';
            document.getElementById('filterComplete').checked = false;

            document.getElementById('searchInput').value = (code && code !== '未登録' && code !== 'UNMAPPED') ? code : name;

            applyFilters();
        }

        // ==========================================
        // サマリー描画
        // ==========================================
        function renderSummary() {
            const container = document.getElementById('summaryContainer');
            if (!globalData || globalData.length === 0) return;

            const categoryCounts = {};
            unmappedData.forEach(row => {
                const cat = row['トラブル発生会社_UNMAPPED詳細区分'] || '区分未設定';
                categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
            });

            const sortedCategories = Object.keys(categoryCounts).sort();
            
            const itemsHtml = sortedCategories.map((cat, idx) => `
                <div class="inline-flex items-center">
                    <span class="text-gray-500">${cat}:</span>
                    <strong class="text-gray-800 ml-1 font-bold">${categoryCounts[cat].toLocaleString()}</strong><span class="text-gray-400 text-[11px] ml-0.5">件</span>
                    ${idx < sortedCategories.length - 1 ? '<span class="text-gray-300 ml-3">|</span>' : ''}
                </div>
            `).join('');

            container.innerHTML = `<div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-600">${itemsHtml}</div>`;
        }
    </script>
</body>
</html>
